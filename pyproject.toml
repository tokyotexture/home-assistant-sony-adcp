[project]
name = "ha-sony-adcp"
version = "2.2.2"
description = "Async Sony ADCP projector integration for Home Assistant"
requires-python = ">=3.13"
license = { text = "Apache-2.0" }

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
