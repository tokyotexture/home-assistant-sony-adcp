name: Add brand assets

on:
  push:
    branches: [modern-integration]
    paths: [.github/workflows/add-brand-assets.yml]

permissions:
  contents: write

jobs:
  add-brand-assets:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modern-integration
      - name: Decode brand assets
        run: |
          mkdir -p custom_components/sony_adcp/brand
          : > /tmp/icon.b64
          printf '%s' '' >> /tmp/icon.b64
          printf '%s' '' >> /tmp/icon.b64
          printf '%s' '' >> /tmp/icon.b64
          printf '%s' '' >> /tmp/icon.b64
          printf '%s' '' >> /tmp/icon.b64
          printf '%s' '' >> /tmp/icon.b64
          printf '%s' '' >> /tmp/icon.b64
          printf '%s' '' >> /tmp/icon.b64
          printf '%s' '' >> /tmp/icon.b64
          printf '%s' '' >> /tmp/icon.b64
          base64 --decode /tmp/icon.b64 > custom_components/sony_adcp/brand/icon.png
          : > /tmp/icon2x.b64
          printf '%s' '' >> /tmp/icon2x.b64
          printf '%s' '' >> /tmp/icon2x.b64
          printf '%s' '' >> /tmp/icon2x.b64
          printf '%s' '' >> /tmp/icon2x.b64
          printf '%s' '' >> /tmp/icon2x.b64
          printf '%s' '' >> /tmp/icon2x.b64
          printf '%s' '' >> /tmp/icon2x.b64
          printf '%s' '' >> /tmp/icon2x.b64
          printf '%s' '' >> /tmp/icon2x.b64
          printf '%s' '' >> /tmp/icon2x.b64
          printf '%s' '' >> /tmp/icon2x.b64
          printf '%s' '' >> /tmp/icon2x.b64
          printf '%s' '' >> /tmp/icon2x.b64
          printf '%s' '' >> /tmp/icon2x.b64
          printf '%s' '' >> /tmp/icon2x.b64
          printf '%s' '' >> /tmp/icon2x.b64
          printf '%s' '' >> /tmp/icon2x.b64
          printf '%s' '' >> /tmp/icon2x.b64
          printf '%s' '' >> /tmp/icon2x.b64
          printf '%s' '' >> /tmp/icon2x.b64
          printf '%s' '' >> /tmp/icon2x.b64
          printf '%s' '' >> /tmp/icon2x.b64
          printf '%s' '' >> /tmp/icon2x.b64
          printf '%s' '' >> /tmp/icon2x.b64
          printf '%s' '' >> /tmp/icon2x.b64
          printf '%s' '' >> /tmp/icon2x.b64
          printf '%s' '' >> /tmp/icon2x.b64
          printf '%s' '' >> /tmp/icon2x.b64
          printf '%s' '' >> /tmp/icon2x.b64
          printf '%s' '' >> /tmp/icon2x.b64
          printf '%s' '' >> /tmp/icon2x.b64
          printf '%s' '' >> /tmp/icon2x.b64
          printf '%s' '' >> /tmp/icon2x.b64
          printf '%s' '' >> /tmp/icon2x.b64
          printf '%s' '' >> /tmp/icon2x.b64
          printf '%s' '' >> /tmp/icon2x.b64
          printf '%s' '' >> /tmp/icon2x.b64
          printf '%s' '' >> /tmp/icon2x.b64
          base64 --decode /tmp/icon2x.b64 > custom_components/sony_adcp/brand/icon@2x.png
          rm -f custom_components/sony_adcp/brand/.gitkeep
      - name: Commit brand assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add custom_components/sony_adcp/brand
          git commit -m 'Add Sony ADCP brand assets'
          git push
